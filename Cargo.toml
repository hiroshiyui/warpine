[package]
name = "warpine"
version = "0.0.6"
edition = "2024"
license = "GPL-3.0-or-later"
default-run = "warpine"

[dependencies]
kvm-bindings = "0.14.0"
kvm-ioctls = "0.24.0"
libc = "0.2.183"
log = "0.4"
# SDL3 via the system library (pkg-config). Only the safe sdl3-rs API is
# used: no `unsafe_textures`, no direct sdl3-sys calls.
sdl3 = { version = "0.22.1", features = ["use-pkg-config"] }
bytemuck = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
gdbstub = "0.7"
gdbstub_arch = "0.3"
encoding_rs = "0.8"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "archive", "std"] }
ab_glyph = "0.2.32"
ab_glyph_rasterizer = "0.1.10"
skrifa = "0.50.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
