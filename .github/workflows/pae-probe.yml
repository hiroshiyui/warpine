# A quick check of PAE guests on GitHub's runners (ADR-0131 addendum):
# eight jobs at once, each printing its host's processor and KVM settings
# and running hello alone, then six single- and multi-threaded tests
# (ci/matrix.sh probe), to land on a runner that cannot run PAE guests
# without waiting for the whole matrix. It runs weekly, to catch new runner
# hardware before a push meets it, and by hand: `gh workflow run pae-probe.yml`.
name: PAE probe

on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'   # Mondays, 04:47 UTC, after the fuzz run

permissions:
  contents: read
  packages: read

jobs:
  probe:
    name: probe ${{ matrix.n }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out the commit (plain git)
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git fetch -q --depth=1 "$REPO" "$SHA"
          git checkout -q FETCH_HEAD

      - name: Let the runner's user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Log in to GitHub's registry (read-only), for the published image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin \
            || echo "No registry login, so the image will be built"

      - name: Probe PAE guests in the pinned image
        env:
          CI_JOBS: "4"
          CI_IMAGE_PULL: "1"
        run: ci/run.sh probe
