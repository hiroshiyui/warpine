# Warpine architecture: the layer map the diagram is generated from.
#
#   cargo run --bin gen_arch -- render   # writes warpine.dot, .svg, .png
#   cargo run --bin gen_arch -- check    # validates this file against src/
#
# This file is the hand-written half of the diagram's source; the other half
# is the list of modules in src/, which gen_arch reads itself. A test
# (`cargo test --bin gen_arch`) fails when a module under src/ is in no
# layer or in two, when a module named here does not exist, when a flow
# names an unknown node, or when warpine.dot is not what this file and
# src/ generate. After changing the code's module list or this file, run
# `render` and commit the three outputs with it.
#
# Syntax: a subset of TOML. Tables [[zone]], [[layer]], [[external]] and
# [[flow]]; string values in double quotes; `modules` an array of strings
# (one line or several). Module names are paths relative to src/.
#
# Zones are the boxes the layers sit in; `rank = "min"` / `"max"` puts a
# zone's nodes in the top / bottom row. Layers belong to a zone; their
# modules are listed in the node. Externals are things outside Warpine's
# source (the guest program, KVM, SDL, the host file system …). Flows are
# the arrows, between layers and externals.

[[zone]]
id = "guest"
label = "Guest: inside the KVM virtual machine (ADR-0003)"
rank = "min"

[[zone]]
id = "host"
label = "Warpine host process (one per OS/2 process, ADR-0020)"

[[zone]]
id = "server"
label = "Desktop server process (one per session, ADR-0052)"

[[zone]]
id = "os"
label = "Host system"
rank = "max"

[[zone]]
id = "build"
label = "Build tools (separate programs)"
rank = "max"

# ── Guest side ──────────────────────────────────────────────────────────────

[[external]]
id = "program"
zone = "guest"
label = "OS/2 program (LX / NE) and its DLLs"

[[external]]
id = "thunks"
zone = "guest"
label = "API stub area at MAGIC_API_BASE: INT 3 per ordinal (ADR-0005)"

# ── Warpine host process ────────────────────────────────────────────────────

[[layer]]
id = "entry"
zone = "host"
label = "Start-up: PM, VIO window, full screen or headless"
modules = ["main.rs", "api.rs"]

[[layer]]
id = "formats"
zone = "host"
label = "Executable formats"
modules = ["lx.rs", "lx/header.rs", "ne.rs", "ne/header.rs"]

[[layer]]
id = "loading"
zone = "host"
label = "Loading and guest memory: objects, fixups, GDT / IDT, imports"
modules = ["loader/lx_loader.rs", "loader/ne_exec.rs", "loader/descriptors.rs", "loader/guest_mem.rs"]

[[layer]]
id = "vcpu"
zone = "host"
label = "vCPUs and threads: VM exits, kicks, callbacks, exceptions, signals (ADR-0007, ADR-0023)"
modules = [
  "loader/vm_backend.rs", "loader/kvm_backend.rs", "loader/vcpu.rs", "loader/threads.rs",
  "loader/critsec.rs", "loader/exitlist.rs", "loader/seh.rs", "loader/signals.rs",
  "loader/host_signal.rs", "loader/interrupt.rs",
]

[[layer]]
id = "dispatch"
zone = "host"
label = "API dispatch: registry, sub-dispatchers, tracing"
modules = ["loader/api_registry.rs", "loader/api_dispatch.rs", "loader/api_trace.rs", "loader/api_ring.rs"]

[[layer]]
id = "core"
zone = "host"
label = "Loader core: Loader, SharedState, managers, constants"
modules = ["loader/mod.rs", "loader/managers.rs", "loader/mutex_ext.rs", "loader/constants.rs"]

[[layer]]
id = "kernel"
zone = "host"
label = "Kernel APIs: DOSCALLS, QUECALLS, MSG, processes and WinStartApp (nesting limit, ADR-0028), CONFIG.SYS THREADS= session limit, IPC, named pipes (ADR-0022), shared memory and semaphores across processes (ADR-0049, ADR-0050), timers, session clock and WARPINE.DLL 64-bit time (ADR-0039), 16-bit information segments (ADR-0040)"
modules = [
  "loader/doscalls.rs", "loader/stubs.rs", "loader/process.rs", "loader/ipc.rs",
  "loader/dostimer.rs", "loader/modpath.rs", "loader/suballoc.rs", "loader/cmd.rs",
  "loader/npipe.rs", "loader/npipe_dir.rs", "loader/npipe_api.rs", "loader/npipe_sem.rs", "loader/inherit.rs", "loader/msgcalls.rs",
  "loader/pm_startapp.rs", "loader/config_sys.rs", "loader/session_threads.rs", "loader/shared_arena.rs", "loader/shared_sem.rs",
  "loader/clock.rs", "loader/warpine_api.rs", "loader/infoseg.rs",
]

[[layer]]
id = "nls"
zone = "host"
label = "NLS and codepages: Unicode inside (ADR-0008, ADR-0016)"
modules = ["loader/codepage.rs", "loader/locale.rs", "loader/uconv.rs"]

[[layer]]
id = "vfs"
zone = "host"
label = "Virtual file system: drives on host directories (ADR-0009)"
modules = ["loader/vfs.rs", "loader/vfs_hostdir.rs"]

[[layer]]
id = "net_mm"
zone = "host"
label = "Sockets and multimedia: SO32DLL / TCP32DLL, MMPM/2"
modules = ["loader/tcpip.rs", "loader/mmpm.rs"]

[[layer]]
id = "textmode"
zone = "host"
label = "Text mode: VIOCALLS, KBDCALLS, MOUCALLS, ANSI console"
modules = [
  "loader/console.rs", "loader/ansi.rs", "loader/viocalls.rs", "loader/kbdcalls.rs",
  "loader/moucalls.rs", "loader/vio_frame.rs",
]

[[layer]]
id = "pmwin"
zone = "host"
label = "PM window manager: PMWIN windows, messages, hooks (ADR-0026), input, painting, presentation parameters, atoms, DDE, dialogs embedded in windows (ADR-0042)"
modules = [
  "loader/pm_win.rs", "loader/pm_types.rs", "loader/pm_window.rs", "loader/pm_input.rs",
  "loader/pm_dialog.rs", "loader/pm_msgbox.rs", "loader/pm_destroy.rs", "loader/pm_error.rs",
  "loader/pm_pointer.rs", "loader/pm_minmax.rs", "loader/pm_sysmenu.rs", "loader/pm_paint.rs",
  "loader/pm_query.rs", "loader/pm_keystate.rs", "loader/pm_syscolor.rs", "loader/pm_rect.rs",
  "loader/pm_cursor.rs", "loader/pm_message.rs", "loader/pm_hook.rs",
  "loader/pm_frame.rs", "loader/pm_accel.rs", "loader/pm_winmisc.rs", "loader/pm_remote.rs", "loader/pm_enum.rs",
  "loader/pm_presparam.rs", "loader/pm_paint_style.rs", "loader/pm_atom.rs", "loader/pm_dde.rs",
]

[[layer]]
id = "controls"
zone = "host"
label = "Built-in controls: statics, buttons, entry fields, MLE, list box, scroll bar, combo box, spin button, slider, value set, notebook, container (records in guest memory, ADR-0043; sorting by chained guest calls, ADR-0044), drag and drop (ADR-0045; between programs, ADR-0057), owner draw (ADR-0025)"
modules = [
  "loader/pm_controls.rs", "loader/pm_button.rs", "loader/pm_list.rs", "loader/pm_edit.rs",
  "loader/pm_scrollbar.rs", "loader/pm_combo.rs", "loader/pm_spin.rs", "loader/pm_owner.rs",
  "loader/pm_static.rs", "loader/pm_notebook.rs", "loader/pm_container.rs", "loader/pm_drag.rs",
  "loader/pm_slider.rs", "loader/pm_valueset.rs",
]

[[layer]]
id = "gpi"
zone = "host"
label = "GPI: presentation spaces, state, transforms, drawing, fonts, bitmaps, regions, clipping, paths (ADR-0024, ADR-0027)"
modules = [
  "loader/pm_gpi.rs", "loader/pm_bitmap.rs", "loader/pm_shapes.rs", "loader/pm_drawtext.rs",
  "loader/pm_region.rs", "loader/pm_area.rs", "loader/pm_text.rs", "loader/pm_xform.rs", "loader/pm_coords.rs",
  "loader/pm_psstate.rs",
]

[[layer]]
id = "pmshell"
zone = "host"
label = "PM shell DLLs: PMSHAPI profiles (ADR-0017), the switch list (the session's, ADR-0056), HELPMGR, the SOM runtime kernel (ADR-0059 to ADR-0062)"
modules = ["loader/pmshapi.rs", "loader/profile.rs", "loader/helpmgr.rs", "loader/pm_switch.rs", "loader/som.rs"]

[[layer]]
id = "stddlg"
zone = "host"
label = "Standard dialogs and printing: PMCTLS file and font dialogs built in memory of built-in controls, PMSPL spooler and device escapes without printers (ADR-0029)"
modules = ["loader/pm_stddlg.rs", "loader/pm_filedlg.rs", "loader/pm_fontdlg.rs", "loader/pmspl.rs"]

[[layer]]
id = "desktop"
zone = "host"
label = "PM desktop front end: surfaces, compositor, chrome, fonts (ADR-0011, ADR-0012)"
modules = [
  "gui/mod.rs", "gui/renderer.rs", "gui/sdl_renderer.rs", "gui/sdl_renderer/compositor.rs",
  "gui/surface.rs", "gui/region.rs", "gui/damage.rs", "gui/font.rs", "gui/glyph_transform.rs", "gui/message.rs", "gui/pointer.rs",
  "gui/cursor.rs", "gui/popup_menu.rs", "gui/system_menu.rs", "gui/frame_track.rs",
  "gui/frame_stats.rs", "gui/gui_script.rs", "gui/headless.rs", "gui/audio.rs",
  "gui/sdl_renderer/compositor/remote.rs",
]

[[layer]]
id = "desklink"
zone = "host"
label = "Desktop link: frame pictures in sealed memfds, the desktop protocol and socket (ADR-0052)"
modules = ["desktop/mod.rs", "desktop/client.rs", "desktop/proto.rs", "desktop/transport.rs",
           "desktop/pixmap.rs", "gui/desktop_events.rs"]

[[layer]]
id = "textdisplay"
zone = "host"
label = "Text-mode display: VIO window and full-screen text (ADR-0013)"
modules = ["gui/text_renderer.rs", "gui/vio_window.rs", "gui/vio_view.rs", "gui/vio_switch.rs"]

[[layer]]
id = "debug"
zone = "host"
label = "Debugging: GDB stub, crash dumps"
modules = ["loader/gdb_stub.rs", "loader/crash_dump.rs"]

[[layer]]
id = "tools"
zone = "build"
label = "Build tools: lx-link, gen_api, gen_arch, gen_compat (ADR-0006, ADR-0015, ADR-0021, ADR-0033)"
modules = ["bin/lx_link.rs", "bin/gen_api.rs", "bin/gen_arch.rs", "bin/gen_compat.rs"]

[[layer]]
id = "deskserver"
zone = "server"
label = "Desktop server: one SDL desktop per session, stacking, activation, input in order, window calls across programs, the session's shell services and drag strings (ADR-0052–0057)"
modules = ["gui/desktop_server.rs", "desktop/model.rs", "desktop/calls.rs", "desktop/services.rs"]

# ── Host system ─────────────────────────────────────────────────────────────

[[external]]
id = "kvm"
zone = "os"
label = "Linux KVM (/dev/kvm)"

[[external]]
id = "sdl"
zone = "os"
label = "SDL3: display, input, audio, clipboard (ADR-0010)"

[[external]]
id = "hostfs"
zone = "os"
label = "Host file system: drive C: in $XDG_DATA_HOME/warpine/drive_c"

[[external]]
id = "network"
zone = "os"
label = "Host network (Linux sockets)"

[[external]]
id = "children"
zone = "os"
label = "Child Warpine processes (DosExecPgm, WinStartApp, pipes, signal exceptions)"

[[external]]
id = "gdb"
zone = "os"
label = "GDB (remote protocol over TCP)"

# ── Flows ───────────────────────────────────────────────────────────────────

[[flow]]
from = "entry"
to = "formats"
label = "parse"

[[flow]]
from = "entry"
to = "loading"
label = "load"

[[flow]]
from = "loading"
to = "program"
label = "map pages, apply fixups"

[[flow]]
from = "program"
to = "thunks"
label = "call an import"

[[flow]]
from = "thunks"
to = "vcpu"
label = "INT 3 → VM exit"

[[flow]]
from = "vcpu"
to = "kvm"
label = "KVM_RUN"

[[flow]]
from = "vcpu"
to = "dispatch"
label = "module + ordinal"

[[flow]]
from = "vcpu"
to = "program"
label = "callbacks: window procedures, exception handlers, exit lists"

[[flow]]
from = "dispatch"
to = "kernel"

[[flow]]
from = "dispatch"
to = "textmode"

[[flow]]
from = "dispatch"
to = "pmwin"

[[flow]]
from = "dispatch"
to = "gpi"

[[flow]]
from = "dispatch"
to = "pmshell"

[[flow]]
from = "dispatch"
to = "net_mm"

[[flow]]
from = "kernel"
to = "vfs"

[[flow]]
from = "kernel"
to = "nls"

[[flow]]
from = "kernel"
to = "children"
label = "DosExecPgm / WinStartApp (arguments, environment, inherited handles), named pipes"

[[flow]]
from = "vcpu"
to = "children"
label = "signals and DosKillProcess as real-time signals (pidfd)"

[[flow]]
from = "pmshell"
to = "vfs"
label = "profiles"

[[flow]]
from = "dispatch"
to = "stddlg"

[[flow]]
from = "stddlg"
to = "controls"
label = "dialogs of built-in controls"

[[flow]]
from = "stddlg"
to = "vfs"
label = "browse drives"

[[flow]]
from = "vfs"
to = "hostfs"

[[flow]]
from = "net_mm"
to = "network"

[[flow]]
from = "net_mm"
to = "sdl"
label = "audio"

[[flow]]
from = "pmwin"
to = "controls"

[[flow]]
from = "pmwin"
to = "gpi"
label = "paint"

[[flow]]
from = "controls"
to = "gpi"

[[flow]]
from = "gpi"
to = "desktop"
label = "draw into frame surfaces"

[[flow]]
from = "desktop"
to = "pmwin"
label = "input events, GUIMessage replies"

[[flow]]
from = "textmode"
to = "textdisplay"
label = "VIO buffer (keys and mouse back)"

[[flow]]
from = "desktop"
to = "sdl"

[[flow]]
from = "textdisplay"
to = "sdl"

[[flow]]
from = "debug"
to = "gdb"

[[flow]]
from = "desktop"
to = "desklink"
label = "frame pictures, input acknowledgements"

[[flow]]
from = "pmwin"
to = "desklink"
label = "calls on other programs' windows"

[[flow]]
from = "desklink"
to = "deskserver"
label = "socket in the session directory"

[[flow]]
from = "deskserver"
to = "sdl"
label = "the session's desktop window and input"
